<!DOCTYPE html>
<html lang="en" style="width: 100%; height: 100%;">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIMirror</title>
    <!-- CSS only -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-KyZXEAg3QhqLMpG8r+8fhAXLRk2vvoC2f3B09zVXn8CA5QIVfZOJ3BCsw2P0p/We" crossorigin="anonymous">
    <!-- JavaScript Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-U1DAWAznBHeqEIlVSCgzq+c9gqGAJn5c/t99JyeKa9xxaYpSvHU5awsuZVVFIhvj" crossorigin="anonymous">
    </script>


    <style>
        /* reused from other projects */

        * {
            text-align: center;
        }

        .center {
            position: relative;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }

        #main {
            width: min(92vw, 680px);
            height: min-content;
            z-index: 3;
            overflow: hidden;
            overflow-y: scroll;
        }

        #card-body { padding: 1rem; }
        #preview-controls {
            position: sticky;
            top: 0;
            z-index: 2;
            max-width: 480px;
            margin: 1rem auto 0;
            padding: .5rem 0;
            background: #fff;
        }
        #preview-container { position: relative; max-width: 100%; margin: 1rem auto; }
        #screen-preview {
            display: block;
            width: min(var(--preview-width, 480px), 100%);
            height: auto;
            margin: 0 auto;
            image-rendering: pixelated;
            background: #000;
        }
        #preview-placeholder {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            padding: 1rem;
            color: #fff;
            pointer-events: none;
        }
        #preview-placeholder[hidden] { display: none; }
        #screen-preview:fullscreen {
            width: 100vw;
            height: 100vh;
            object-fit: contain;
            background: #000;
        }
        @media (max-width: 520px) {
            #main { width: 96vw; max-height: 94% !important; }
        }
    </style>
</head>

<body style="width: 100%; height: 100%; background-color: #5f9ea0;">
    <div class="center card" id="main" style="max-height: 80%;">
        <div id="card-header" class="card-header">
            <b>TIMirror</b>
        </div>
        <div id="card-body" class="card-body" style="height: min-content;">
            <div>Be sure calculator is turned on <b>before</b> connecting, otherwise connection may fail.</div>
            <br />
            <button class="btn btn-primary" id="startmirror">Connect & Start Mirroring</button>
            <div id="preview-controls">
                <label class="form-label" for="preview-size">Preview size: <span id="preview-size-value">480</span> px wide</label>
                <input class="form-range" id="preview-size" type="range" min="160" max="960" step="16" value="480" aria-label="Preview width">
                <div class="d-flex gap-2 justify-content-center flex-wrap">
                    <button class="btn btn-primary" id="copy-screenshot" type="button">Copy Screenshot</button>
                    <button class="btn btn-primary" id="pip-preview" type="button">Open PiP</button>
                    <button class="btn btn-primary" id="fullscreen-preview" type="button">Full Screen</button>
                </div>
                <div id="screenshot-status" class="small mt-2" role="status" aria-live="polite">Connect your calculator to enable screenshot copying.</div>
            </div>
            <div id="preview-container">
                <canvas id="screen-preview" width="320" height="240" aria-label="TI-Nspire calculator screen preview"></canvas>
                <div id="preview-placeholder">Connect your calculator to show its screen.</div>
            </div>
        </div>
    </div>
    <script src="tiusb.min.js"></script>
    <script src="client.js?v=20261013-6"></script>
</body>

</html>
