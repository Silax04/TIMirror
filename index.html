<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f6fb">
    <title>TIMirror</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KyZXEAg3QhqLMpG8r+8fhAXLRk2vvoC2f3B09zVXn8CA5QIVfZOJ3BCsw2P0p/We" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-U1DAWAznBHeqEIlVSCgzq+c9gqGAJn5c/t99JyeKa9xxaYpSvHU5awsuZVVFIhvj" crossorigin="anonymous"></script>
    <style>
        :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #182230; background: #f4f6fb; font-synthesis: none; }
        * { box-sizing: border-box; }
        body { min-width: 320px; min-height: 100vh; margin: 0; padding: clamp(1.25rem, 5vh, 3.5rem) 1rem; background: radial-gradient(ellipse at 50% -15%, rgba(89,128,255,.12), transparent 55%), #f4f6fb; color: #182230; }
        button, label, #screenshot-status { text-align: center; }
        #main { width: min(100%, 900px); margin: 0 auto; overflow: hidden; border: 1px solid #e4e8f0; border-radius: 18px; background: #fff; box-shadow: 0 24px 70px rgba(28,39,64,.10), 0 3px 10px rgba(28,39,64,.04); }
        #card-header { padding: 1.4rem 1.5rem; border-bottom: 1px solid #edf0f5; background: #fff; color: #182230; font-size: 1.15rem; letter-spacing: -.025em; }
        #card-header b { font-weight: 720; }
        #card-body { padding: clamp(1.25rem, 4vw, 2.25rem); }
        .intro { max-width: 620px; margin: 0 auto 1.5rem; color: #647084; font-size: .95rem; line-height: 1.6; text-align: center; }
        .intro strong { color: #344054; font-weight: 650; }
        #startmirror { display: block; min-width: 200px; margin: 0 auto; padding: .72rem 1.25rem; border: 0; border-radius: 10px; background: #315be8; box-shadow: 0 4px 10px rgba(49,91,232,.18); font-size: .95rem; font-weight: 650; transition: background .16s ease, transform .16s ease, box-shadow .16s ease; }
        #startmirror:hover:not(:disabled) { transform: translateY(-1px); background: #244bd0; box-shadow: 0 7px 16px rgba(49,91,232,.22); }
        #startmirror:disabled { opacity: .78; }
        #preview-controls { max-width: 560px; margin: 1.75rem auto 0; padding: 1.15rem 1.25rem 1.2rem; border: 1px solid #e9edf4; border-radius: 14px; background: #f9faff; }
        #preview-controls .form-label { margin-bottom: .6rem; color: #344054; font-size: .9rem; font-weight: 600; }
        #preview-size-value { color: #315be8; font-variant-numeric: tabular-nums; }
        #preview-size { margin: .1rem 0 1rem; }
        .form-range::-webkit-slider-thumb, .form-range::-moz-range-thumb { background-color: #315be8; }
        #preview-controls .btn { min-width: 112px; padding: .55rem .9rem; border: 1px solid #dce3f1; border-radius: 9px; background: #fff; color: #344054; font-size: .88rem; font-weight: 600; transition: border-color .15s ease, color .15s ease, background .15s ease; }
        #preview-controls .btn:hover { border-color: #bdcafa; background: #f0f4ff; color: #244bd0; }
        #preview-controls #copy-screenshot { border-color: #315be8; background: #315be8; color: #fff; }
        #preview-controls #copy-screenshot:hover { background: #244bd0; }
        #screenshot-status { min-height: 1.25rem; margin-top: .9rem !important; color: #7a8495; font-size: .8rem; line-height: 1.5; }
        #preview-container { position: relative; width: min(var(--preview-width, 480px), 100%); margin: 1.4rem auto 0; overflow: hidden; border: 1px solid #e2e6ed; border-radius: 12px; background: #101114; }
        #screen-preview { display: block; width: 100%; height: auto; margin: 0 auto; image-rendering: pixelated; background: #000; }
        #preview-placeholder { position: absolute; inset: 0; display: grid; place-items: center; padding: 1rem; color: #c6ccd6; font-size: .9rem; pointer-events: none; }
        #preview-placeholder[hidden] { display: none; }
        #screen-preview:fullscreen { width: 100vw; height: 100vh; object-fit: contain; background: #000; }
        @media (max-width: 520px) { body { padding: .75rem; } #main { border-radius: 14px; } #card-header { padding: 1rem; } #card-body { padding: 1rem; } #preview-controls { padding: 1rem .8rem; } #preview-controls .btn { flex: 1 1 42%; } }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
    </style>
</head>
<body>
    <main class="card" id="main">
        <header id="card-header"><b>TIMirror</b></header>
        <section id="card-body" class="card-body">
            <p class="intro">Connect your TI‑Nspire to mirror its screen in your browser. Make sure the calculator is turned on <strong>before</strong> connecting.</p>
            <button class="btn btn-primary" id="startmirror" type="button">Connect &amp; Start Mirroring</button>
            <section id="preview-controls" aria-label="Preview controls">
                <label class="form-label d-block" for="preview-size">Preview width <span id="preview-size-value">480</span> px</label>
                <input class="form-range" id="preview-size" type="range" min="160" max="960" step="16" value="480" aria-label="Preview width">
                <div class="d-flex gap-2 justify-content-center flex-wrap">
                    <button class="btn" id="copy-screenshot" type="button">Copy Screenshot</button>
                    <button class="btn" id="pip-preview" type="button">Open PiP</button>
                    <button class="btn" id="fullscreen-preview" type="button">Full Screen</button>
                </div>
                <div id="screenshot-status" class="small mt-2" role="status" aria-live="polite">Connect your calculator to enable screenshot copying.</div>
            </section>
            <div id="preview-container">
                <canvas id="screen-preview" width="320" height="240" aria-label="TI-Nspire calculator screen preview"></canvas>
                <div id="preview-placeholder">Your calculator screen will appear here.</div>
            </div>
        </section>
    </main>
    <script src="tiusb.min.js"></script>
    <script src="client.js?v=20261013-6"></script>
</body>
</html>
